[build-system]
requires = ["setuptools>=80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bellikas-retro"
version = "0.0.1"
description = "Analyzes a video game dataset to identify retro titles most relevant to specific age groups, based on release date, platform, and copies sold, and presents the results visually."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "streamlit>=1.53.1",
  "kagglehub>=0.4.1",
  "python-dotenv>=1.2.1",
  "pytest>=9.0.2"
]

[server]
enableStaticServing = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bellikas_retro = "bellikas_retro.cli:main"